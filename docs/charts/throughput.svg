x="174" y="215" class="lab" text-anchor="end">Ternary Bonsai 1 8B</text><line class="g1s" x1="186.0" y1="211" x2="457.4" y2="211" stroke-width="2" opacity="0.32"/><circle class="g1" cx="457.4" cy="211" r="5.5"/><text x="469.4" y="215" class="val">200</text><text x="174" y="245" class="lab" text-anchor="end">Bonsai 2 27B</text><line class="g2s" x1="186.0" y1="241" x2="264.8" y2="241" stroke-width="2" opacity="0.32"/><circle class="g2" cx="264.8" cy="241" r="5.5"/><text x="276.8" y="245" class="val">24</text><text x="174" y="275" class="lab" text-anchor="end">Jev (hosted)</text><line class="g0s" x1="186.0" y1="271" x2="368.4" y2="271" stroke-width="2" opacity="0.32"/><circle class="g0" cx="368.4" cy="271" r="5.5"/><text x="380.4" y="275" class="val">75</text><text x="416.0" y="318" class="sub" text-anchor="middle">decisions per minute (log scale)</text><text x="24" y="334" class="note">Higher is better. Warmup excluded. Local models are one loaded model on this machine; Jev is a hosted API, so its rate includes a network round trip.</text></svg>
