<svg xmlns="http://www.w3.org/2000/svg" width="720" height="558" viewBox="0 0 720 558" role="img" aria-label="Do the probabilities mean anything?">
  <style>
    :root { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --ink3:#84837d; --grid:#e4e3df; --s1:#2a78d6; --s2:#eb6834; --t0:#86b6ef; --t1:#3987e5; --t2:#1c5cab; --s3:#1baf7a; }
    @media (prefers-color-scheme: dark) {
    :root { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --ink3:#8a897f; --grid:#33322f; --s1:#3987e5; --s2:#d95926; --t0:#9ec5f4; --t1:#3987e5; --t2:#184f95; --s3:#199e70; }
    }
    .bg { fill: var(--surface); }
    .ttl { fill: var(--ink); font: 600 15px -apple-system, "Segoe UI", system-ui, sans-serif; }
    .sub { fill: var(--ink2); font: 400 11.5px -apple-system, "Segoe UI", system-ui, sans-serif; }
    .lab { fill: var(--ink); font: 400 12px -apple-system, "Segoe UI", system-ui, sans-serif; }
    .val { fill: var(--ink); font: 600 12px ui-monospace, "SF Mono", Menlo, monospace; }
    .tick { fill: var(--ink3); font: 400 10.5px ui-monospace, "SF Mono", Menlo, monospace; }
    .note { fill: var(--ink3); font: 400 10.5px -apple-system, system-ui, sans-serif; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--ink3); stroke-width: 1; }
    .ref  { stroke: var(--ink3); stroke-width: 1; stroke-dasharray: 4 3; }
    .refh { stroke: var(--s3); stroke-width: 2; stroke-dasharray: 7 4; }
    .noteh { fill: var(--s3); font: 600 11.5px -apple-system, system-ui, sans-serif; }
    .g1 { fill: var(--s1); }  .g2 { fill: var(--s2); }
    .g0 { fill: var(--s3); }
    .tier0 { fill: var(--t0); } .tier1 { fill: var(--t1); } .tier2 { fill: var(--t2); }
    .g1s { stroke: var(--s1); } .g2s { stroke: var(--s2); }
    .g0s { stroke: var(--s3); }
  </style>
  <rect class="bg" width="720" height="558" rx="8"/>
  <text x="24" y="30" class="ttl">Do the probabilities mean anything?</text>
  <text x="24" y="48" class="sub">What the model claimed, against how often it was right. WANLI-256.</text>
<line class="grid" x1="68" y1="492.0" x2="468" y2="492.0"/><text x="58" y="496.0" class="tick" text-anchor="end">0%</text><text x="68.0" y="510" class="tick" text-anchor="middle">0%</text><line class="grid" x1="68" y1="392.0" x2="468" y2="392.0"/><text x="58" y="396.0" class="tick" text-anchor="end">25%</text><text x="168.0" y="510" class="tick" text-anchor="middle">25%</text><line class="grid" x1="68" y1="292.0" x2="468" y2="292.0"/><text x="58" y="296.0" class="tick" text-anchor="end">50%</text><text x="268.0" y="510" class="tick" text-anchor="middle">50%</text><line class="grid" x1="68" y1="192.0" x2="468" y2="192.0"/><text x="58" y="196.0" class="tick" text-anchor="end">75%</text><text x="368.0" y="510" class="tick" text-anchor="middle">75%</text><line class="grid" x1="68" y1="92.0" x2="468" y2="92.0"/><text x="58" y="96.0" class="tick" text-anchor="end">100%</text><text x="468.0" y="510" class="tick" text-anchor="middle">100%</text><line class="ref" x1="68" y1="492.0" x2="468" y2="92.0"/><text x="308.0" y="243.0" class="note" transform="rotate(-45 308.0 243.0)" text-anchor="middle">perfectly calibrated</text><text x="456.0" y="452.0" class="note" text-anchor="end">below the line = overconfident</text><path d="M249.5 172.0 L288.5 184.3 L328.7 346.5 L367.1 335.5 L415.2 213.7 L453.3 174.0 L466.1 146.2" fill="none" class="g2s" stroke-width="2.5"/><circle cx="249.5" cy="172.0" r="5.0" fill="var(--surface)"/><circle class="g2" cx="249.5" cy="172.0" r="3.5"/><circle cx="288.5" cy="184.3" r="5.9" fill="var(--surface)"/><circle class="g2" cx="288.5" cy="184.3" r="4.4"/><circle cx="328.7" cy="346.5" r="5.7" fill="var(--surface)"/><circle class="g2" cx="328.7" cy="346.5" r="4.2"/><circle cx="367.1" cy="335.5" r="6.6" fill="var(--surface)"/><circle class="g2" cx="367.1" cy="335.5" r="5.1"/><circle cx="415.2" cy="213.7" r="6.6" fill="var(--surface)"/><circle class="g2" cx="415.2" cy="213.7" r="5.1"/><circle cx="453.3" cy="174.0" r="10.3" fill="var(--surface)"/><circle class="g2" cx="453.3" cy="174.0" r="8.8"/><circle cx="466.1" cy="146.2" r="8.3" fill="var(--surface)"/><circle class="g2" cx="466.1" cy="146.2" r="6.8"/><circle class="g2" cx="494" cy="94" r="5.5"/><text x="508" y="98" class="lab">Bonsai 2 27B, raw</text><text x="508" y="115" class="sub">calibration error 0.176</text><path d="M244.5 225.3 L284.0 324.3 L326.1 200.3 L372.5 175.1 L408.4 142.7" fill="none" class="g1s" stroke-width="2.5"/><circle cx="244.5" cy="225.3" r="6.8" fill="var(--surface)"/><circle class="g1" cx="244.5" cy="225.3" r="5.3"/><circle cx="284.0" cy="324.3" r="7.0" fill="var(--surface)"/><circle class="g1" cx="284.0" cy="324.3" r="5.5"/><circle cx="326.1" cy="200.3" r="7.9" fill="var(--surface)"/><circle class="g1" cx="326.1" cy="200.3" r="6.4"/><circle cx="372.5" cy="175.1" r="9.0" fill="var(--surface)"/><circle class="g1" cx="372.5" cy="175.1" r="7.5"/><circle cx="408.4" cy="142.7" r="8.8" fill="var(--surface)"/><circle class="g1" cx="408.4" cy="142.7" r="7.3"/><circle cx="429.1" cy="92.0" r="5.0" fill="var(--surface)" opacity="0.35"/><circle class="g1" cx="429.1" cy="92.0" r="3.5" opacity="0.35"/><circle class="g1" cx="494" cy="140" r="5.5"/><text x="508" y="144" class="lab">Bonsai 2 27B, T=2.45</text><text x="508" y="161" class="sub">calibration error 0.088</text><path d="M285.1 292.0 L323.7 300.7 L365.8 219.3 L406.5 174.4 L446.4 178.7 L467.1 107.8" fill="none" class="g0s" stroke-width="2.5"/><circle cx="258.0" cy="492.0" r="5.0" fill="var(--surface)" opacity="0.35"/><circle class="g0" cx="258.0" cy="492.0" r="3.5" opacity="0.35"/><circle cx="285.1" cy="292.0" r="5.9" fill="var(--surface)"/><circle class="g0" cx="285.1" cy="292.0" r="4.4"/><circle cx="323.7" cy="300.7" r="6.6" fill="var(--surface)"/><circle class="g0" cx="323.7" cy="300.7" r="5.1"/><circle cx="365.8" cy="219.3" r="6.5" fill="var(--surface)"/><circle class="g0" cx="365.8" cy="219.3" r="5.0"/><circle cx="406.5" cy="174.4" r="7.2" fill="var(--surface)"/><circle class="g0" cx="406.5" cy="174.4" r="5.7"/><circle cx="446.4" cy="178.7" r="8.3" fill="var(--surface)"/><circle class="g0" cx="446.4" cy="178.7" r="6.8"/><circle cx="467.1" cy="107.8" r="9.7" fill="var(--surface)"/><circle class="g0" cx="467.1" cy="107.8" r="8.2"/><circle class="g0" cx="494" cy="186" r="5.5"/><text x="508" y="190" class="lab">Jev, raw</text><text x="508" y="207" class="sub">calibration error 0.103</text><text x="494" y="242" class="note">dot size = predictions in that bin</text><text x="494" y="258" class="note">faded = fewer than 5, not joined</text><line class="axis" x1="68" y1="492" x2="468" y2="492"/><line class="axis" x1="68" y1="92" x2="68" y2="492"/><text x="268.0" y="528" class="sub" text-anchor="middle">probability the model claimed</text><text x="24" y="548" class="note">Calibrating flattens the curve onto the diagonal and stops it claiming 0.99 at all. The answers themselves do not change.</text></svg>
