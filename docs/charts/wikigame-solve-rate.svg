 class="tier1" d="M218 240 H633.9 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 H218 Z"/><text x="646.9" y="256" class="val">34/40</text><path class="tier2" d="M218 268 H580.9714285714285 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 H218 Z"/><text x="593.9714285714285" y="284" class="val">26/35</text><line class="axis" x1="218" y1="208" x2="218" y2="286"/><text x="204" y="330" class="lab" text-anchor="end">Bonsai 1 8B</text><text x="204" y="347" class="sub" text-anchor="end">1.16 GB local &#183; 87/110 overall</text><path class="tier0" d="M218 308 H708.0 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 H218 Z"/><text x="721.0" y="324" class="val">35/35</text><path class="tier1" d="M218 336 H621.55 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 H218 Z"/><text x="634.55" y="352" class="val">33/40</text><path class="tier2" d="M218 364 H482.1714285714286 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 H218 Z"/><text x="495.1714285714286" y="380" class="val">19/35</text><line class="axis" x1="218" y1="304" x2="218" y2="382"/><text x="204" y="426" class="lab" text-anchor="end">Bonsai 2 27B</text><text x="204" y="443" class="sub" text-anchor="end">5.95 GB local &#183; 106/110 overall</text><path class="tier0" d="M218 404 H708.0 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 H218 Z"/><text x="721.0" y="420" class="val">35/35</text><path class="tier1" d="M218 432 H683.3 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 H218 Z"/><text x="696.3" y="448" class="val">38/40</text><path class="tier2" d="M218 460 H679.7714285714285 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 H218 Z"/><text x="692.7714285714285" y="476" class="val">33/35</text><line class="axis" x1="218" y1="400" x2="218" y2="478"/><text x="204" y="522" class="lab" text-anchor="end">Jev (hosted)</text><text x="204" y="539" class="sub" text-anchor="end">hosted API &#183; 110/110 overall</text><path class="tier0" d="M218 500 H708.0 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 H218 Z"/><text x="721.0" y="516" class="val">35/35</text><path class="tier1" d="M218 528 H708.0 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 H218 Z"/><text x=