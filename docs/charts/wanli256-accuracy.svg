    .g1 { fill: var(--s1); }  .g2 { fill: var(--s2); }
    .g0 { fill: var(--s3); }
    .tier0 { fill: var(--t0); } .tier1 { fill: var(--t1); } .tier2 { fill: var(--t2); }
    .g1s { stroke: var(--s1); } .g2s { stroke: var(--s2); }
    .g0s { stroke: var(--s3); }
